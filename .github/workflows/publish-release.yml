name: Publikuj aktualizacje Olusia AI Studio

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - app.py
      - updater.py
      - cards.py
      - flashcards_ui.py
      - processor.py
      - ocr_local.py
      - dev/make_update.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olusia-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testy kodu
        run: |
          set -euo pipefail
          python -m pip install -q pytest "fsrs>=6.0,<7"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pytest -q tests/test_cards_and_update.py tests/test_processor.py
      - name: Zbuduj i opublikuj aktualizację
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje."
            exit 0
          fi
          python dev/make_update.py "Olusia_AI_Studio_UPDATE_${TAG}.zip"
          gh release create "$TAG" "Olusia_AI_Studio_UPDATE_${TAG}.zip" \
            --target "$GITHUB_SHA" --title "Olusia AI Studio $TAG" \
            --notes "Aktualizacja Olusia AI Studio. W aplikacji wybierz Aktualizacje → Sprawdź → Pobierz → Zainstaluj."
