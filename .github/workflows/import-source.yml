name: Importuj Olusia AI Studio i opublikuj pierwsze wydanie

on:
  push:
    branches: [main]
    paths:
      - Olusia_AI_Studio_GitHub_v2.1.1.bundle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: olusia-import-main
  cancel-in-progress: false

jobs:
  import-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Importuj sprawdzoną paczkę źródłową
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, stat
          archive=Path("Olusia_AI_Studio_GitHub_v2.1.1.bundle")
          if not archive.is_file():
              raise SystemExit("Brak paczki .bundle — dodaj ją do repozytorium.")
          expected="f503f929c08de58600485148e0492e34508b8aff14a172160bcea150a9d2976f"
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise SystemExit("Błąd SHA-256. Nie jest to oryginalna paczka źródłowa v2.1.1.")
          allowed={
              ".github/workflows/publish-release.yml",".gitignore",".streamlit/config.toml",
              "0_UAKTUALIZUJ_STARA_WERSJE.command","1_ZAINSTALUJ.command",
              "2_URUCHOM.command","3_DIAGNOSTYKA.command","4_AKTUALIZUJ.command",
              "5_DOINSTALUJ_FISZKI.command","6_UTWORZ_APLIKACJE.command",
              "GITHUB_AKTUALIZACJE.md","README.md","START_TUTAJ.html","VERSION",
              "app.py","cards.py","dev/make_update.py","flashcards_ui.py",
              "ocr_local.py","processor.py","requirements-core.txt",
              "tests/test_cards_and_update.py","tests/test_processor.py",
              "update_source.json","updater.py","updates_ui.py"
          }
          with ZipFile(archive) as z:
              names=set(z.namelist())
              if names!=allowed:
                  raise SystemExit(f"Niezgodna lista plików. Brak: {allowed-names}; inne: {names-allowed}")
              for info in z.infolist():
                  rel=PurePosixPath(info.filename)
                  if rel.is_absolute() or ".." in rel.parts or info.file_size>2_000_000:
                      raise SystemExit("Niedozwolony plik w archiwum.")
                  mode=(info.external_attr>>16)&0o170000
                  if info.is_dir() or mode == stat.S_IFLNK:
                      raise SystemExit("Niedozwolony typ pliku w archiwum.")
                  if str(rel) in {".github/workflows/publish-release.yml", "README.md", "GITHUB_AKTUALIZACJE.md"}:
                      continue
                  dest=Path(*rel.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(info))
                  if dest.suffix==".command":
                      dest.chmod(0o755)
          archive.unlink()
          PY
      - name: Uruchom szybkie testy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pytest -q tests/test_cards_and_update.py tests/test_processor.py
      - name: Zapisz pliki aplikacji w main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish Olusia AI Studio v2.1.1 source"
            git push origin HEAD:main
          fi
      - name: Zbuduj ZIP i opublikuj GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          TARGET_SHA="$(git rev-parse HEAD)"
          python dev/make_update.py "Olusia_AI_Studio_UPDATE_${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje."
          else
            gh release create "$TAG" "Olusia_AI_Studio_UPDATE_${TAG}.zip" \
              --target "$TARGET_SHA" --title "Olusia AI Studio $TAG" \
              --notes "Olusia AI Studio v$VERSION: audio, transkrypcja, fiszki i aktualizacje. W aplikacji otwórz Aktualizacje, aby pobrać następną wersję."
          fi
